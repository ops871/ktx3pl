<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="KTX 3PL logo">
  <!-- Texas silhouette + longhorn + star emblem -->
  <g transform="translate(8,10)">
    <!-- Texas silhouette (simplified) -->
    <path fill="#1a2456" d="M44 2 L96 2 L96 34 L120 34 L122 70 L104 96 L92 150 L70 150 L60 120 L44 120 L40 150 L20 150 L8 92 L2 70 L2 34 L44 34 Z" opacity="0.12"/>
    <!-- Longhorn head -->
    <g fill="#7a1f2b">
      <path d="M62 70 q-30 -26 -52 -10 q22 4 30 18 q-12 -6 -22 -2 q16 4 24 14 Z"/>
      <path d="M62 70 q30 -26 52 -10 q-22 4 -30 18 q12 -6 22 -2 q-16 4 -24 14 Z"/>
    </g>
    <ellipse cx="62" cy="92" rx="22" ry="20" fill="#1a2456"/>
    <ellipse cx="54" cy="88" rx="3.4" ry="4" fill="#fff"/>
    <ellipse cx="70" cy="88" rx="3.4" ry="4" fill="#fff"/>
    <!-- Texas star -->
    <path fill="#1a2456" d="M62 120 l6 14 l15 1 l-11 10 l4 15 l-14 -8 l-14 8 l4 -15 l-11 -10 l15 -1 Z"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="92" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="78" letter-spacing="2" fill="#4a5568">KTX</text>
  <text x="152" y="150" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="8" fill="#4a5568">3PL</text>
</svg>
